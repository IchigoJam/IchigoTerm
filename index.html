<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="icon" href="data:">
<title>IchigoTerm</title>
</head><body>
<h1>IchigoTerm</h1>
<main id=main>
  <div id=divij></div>
  <textarea id=talog></textarea>
  <form id=form><input id=inp><button id=btnsend>SEND</button></form>
  <div id=pastebar>
	<div id=fileselectbar>
	  <label id=filelabel for=fileinput>📂 ファイルを選択</label>
	  <input type=file id=fileinput accept=".txt,.bas,. bas,.ij">
	  <span id=filename>（未選択）</span>
	</div>
	<textarea id=tapaste placeholder="ここに複数行テキストをペースト、またはファイルをドロップ"></textarea>
	<div id=pastecontrols>
	  <label>行間ディレイ: <input type=number id=pastedelay value=300 min=50 max=5000 step=50>ms</label>
	  <button id=btnpaste>▶ 一括送信</button>
	  <button id=btnpastestop disabled>■ 停止</button>
	  <span id=pastestatus></span>
	</div>
  </div>

  <div class=buttons>
	<span id=indicator><span id=dot></span><span id=connlabel>切断中</span></span>
	<button id=btnreq>接続</button> →
	<button id=btnled1>LED1</button>
	<button id=btnled0>LED0</button>
	<button id=btnesc>ESC</button>
	<button id=btnfull>FULL</button>
	<label><input type=checkbox id=mixjuice>MixJuice</label>
  </div>
</main>

<hr>
<a href=https://github.com/ichigojam/IchigoTerm/>src on GitHub</a>

<script type="module">
import { BufferedReader } from "https://js.sabae.cc/BufferedReader.js";
//import { BufferedReader } from "./BufferedReader.js";
import { TextWriter } from "https://js.sabae.cc/TextWriter.js";
import { sleep } from "https://js.sabae.cc/sleep.js";
import { IJScreen } from "https://ichigojam.github.io/ij-screen/ij-screen.js";
const ijs = new IJScreen();
divij.appendChild(ijs);

const fetchAndPut = async (url, post) => {
  try {
	const opt = !post ? undefined : {
	  method: "POST",
	  body: encodeBin(post),
	  headers: {
		//"Content-type": "application/octet-stream",
		"Content-type": "text/plain",
	  },
	};
	const bin = await (await fetch(url, opt)).arrayBuffer();
	const s = new Uint8Array(bin);
	for (let i = 0; i < s.length; i++) {
	  const c = s[i];
	  putc(c);
	  await sleep(30);
	  if (!iopanel.chkmixjuice.checked) {
		break;
	  }
	}
  } catch (e) {
	console.log(e);
  }
};

export class MixJuice {
  constructor() {
	this.buf = "";
	this.posts = null;
	this.postsurl = null;
  }
  write(c) {
	for (;;) {
	  this.buf += c;
	  const n = this.buf.indexOf("\n");
	  if (n < 0) {
		return;
	  }
	  const s = this.buf.substring(n);
	  this.buf = this.buf.substring(n + 1);

	  if (s.startsWith("MJ ")) {
		if (s.startsWith("MJ GET ")) {
		  const url = "http://" + s.substring(7);
		  fetchAndPut(url);
		} else if (s.startsWith("MJ GETS ")) {
		  const url = "https://" + s.substring(8);
		  fetchAndPut(url);
		} else if (s.startsWith("MJ POSTS START ")) {
		  this.postsurl = "https://" + s.substring(15);
		  console.log(postsurl)
		  this.posts = [];
		  return;
		} else if (s == "MJ POSTS END") {
		  fetchAndPut(this.postsurl, this.posts.join("\n"));
		}
		/*
		MJ PCT contenttype
		*/
	  }
	  if (this.posts != null) {
		this.posts.push(s);
	  }
		}
  }
  async read() {

  }
}

export const scrollBottom = (comp) => {
  comp.scroll(0, comp.scrollHeight - comp.clientHeight);
};

const ALPHA_U = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const ALPHA_L = "abcdefghijklmnopqrstuvwxyz";
const upperXlower = (c) => {
  const n = ALPHA_L.indexOf(c);
  if (n >= 0) {
	return ALPHA_U[n];
  }
  const m = ALPHA_U.indexOf(c);
  if (m >= 0) {
	return ALPHA_L[m];
  }
  return c;
};

let state = 0;
let cx = 0;

const log = (s) => {
  talog.value += s;
  scrollBottom(talog);
  // for ij-screen
  for (const c of s) {
	const b = c.charCodeAt(0);
	if (state == 0) {
	  if (b == 0x15) {
		state = 1;
	  } else if (b == 0x13) {
		ijs.lc(0, 0);
	  } else if (b == 0x0c) {
		ijs.cls(); // todo: 本当の実装はカーソル以降削除
		// https://fukuno.jig.jp/1092
	  } else if (b >= 0x20 || b == 0xa || b == 0x08) {
		// 大文字小文字反転
		ijs.putc(c);
	  }
	} else if (state == 1) {
	  cx = b - 32;
	  state = 2;
	} else if (state == 2) {
	  const cy = b - 32;
	  ijs.lc(cx, cy);
	  state = 0;
	} else if (b >= 0x20) {
	  ijs.putc(c);
	}
  }
};

let runmain = false;
let disconnect = null;
const main = async (port) => {
  if (runmain) return;
  runmain = true;

  const baudRate = 115200;
  try {
	await port.open({ baudRate });
  } catch (e) {
	runmain = false;
	throw e;
  }
  const portWriter = port.writable.getWriter();
  const writer = new TextWriter(portWriter);
  //const preader = port.readable.getReader();
  const preader = port.readable.getReader({ mode: "byob" });
  const reader = new BufferedReader(preader);
  let connected = true;

  disconnect = async () => {
	if (!connected) return;
	connected = false;
	await preader.cancel().catch(() => {});
	preader.releaseLock();
	await portWriter.close().catch(() => {});
	portWriter.releaseLock();
	await port.close();
	runmain = false;
	disconnect = null;
	dot.className = "";
	connlabel.textContent = "切断中";
	btnreq.textContent = "接続";
  };

  const send = (s) => {
	if (!connected) return;
	writer.writeString(s);
	log(s);
  };
  btnsend.onclick = form.onsubmit = (e) => {
	const s = inp.value + "\n";
	send(s);
	inp.value = "";
	e.preventDefault();
  };

  // 複数行ペースト送信
  let pasteAbort = false;
  btnpaste.onclick = async () => {
	const lines = tapaste.value.split(/\r?\n/);
	if (lines.length === 0 || tapaste.value.trim() === "") return;
	const delay = parseInt(pastedelay.value) || 300;
	pasteAbort = false;
	btnpaste.disabled = true;
	btnpastestop.disabled = false;
	for (let i = 0; i < lines.length; i++) {
	  if (pasteAbort) break;
	  const line = lines[i];
	  send(line + "\n");
	  pastestatus.textContent = `送信中… ${i + 1} / ${lines.length} 行`;
	  if (i < lines.length - 1) {
		await sleep(delay);
	  }
	}
	btnpaste.disabled = false;
	btnpastestop.disabled = true;
	pastestatus.textContent = pasteAbort ? "停止しました" : "送信完了";
  };
  btnpastestop.onclick = () => {
	pasteAbort = true;
  };
  btnled1.onclick = () => {
	send("LED1\n");
  };
  btnled0.onclick = () => {
	send("LED0\n");
  };
  btnesc.onclick = () => {
	send("\x1b");
  };
  let flgright = false;
  let flgleft = false;
  let flgup = false;
  let flgdown = false;
  let flgspace = false;
  document.body.onkeydown = (e) => {
	if (e.target == inp) return;
	if (e.key == "ArrowRight") {
	  if (!flgright) {
		flgright = true;
		send("\x1d");
	  }
	} else if (e.key == "ArrowLeft") {
	  if (!flgleft) {
		flgleft = true;
		send("\x1c");
	  }
	  /*
	} else if (e.key == "ArrowUp") {
	  if (!flgup) {
		flgup = true;
		send("\x1e");
	  }
	} else if (e.key == "ArrowDown") {
	  if (!flgdown) {
		flgdown = true;
		send("\x1f");
	  }
	  */
	} else if (e.key == "Space") {
	  if (!flgspace) {
		flgspace = true;
		send("\x20");
	  }
	} else if (e.key == "Escape") {
	  send("\x1b");
	} else if (e.key == "F1") {
	  send("\x13\x0c");
	} else if (e.key == "F2") {
	  send("LOAD");
	} else if (e.key == "F3") {
	  send("SAVE");
	} else if (e.key == "F4") {
	  send("LIST\n");
	} else if (e.key == "F5") {
	  send("RUN\n");
	} else if (e.key == "Enter") {
	  send("\n");
	} else if (e.key == "Backspace") {
	  send("\x08");
	} else if (e.key.length == 1 && !e.ctrlKey && !e.metaKey) {
	  send(upperXlower(e.key));
	}
  };
  document.body.onkeyup = (e) => {
	if (e.target == inp) return;
	if (e.key == "ArrowRight") {
	  if (flgright) {
		flgright = false;
		send("\x1d");
	  }
	} else if (e.key == "ArrowLeft") {
	  if (flgleft) {
		flgleft = false;
		send("\x1c");
	  }
	  /*
	} else if (e.key == "ArrowUp") {
	  if (flgup) {
		flgup = false;
		send("\x1e");
	  }
	} else if (e.key == "ArrowDown") {
	  if (flgdown) {
		flgdown = false;
		send("\x1f");
	  }
	  */
	} else if (e.key == "Space") {
	  if (flgspace) {
		flgspace = false;
		send("\x20");
	  }
	}
  };
  const loop = async () => {
	try {
	  for (let i = 0; connected; i++) {
		const b = await reader.readByte();
		const c = String.fromCharCode(b);
		log(c);
		if (i == 10) {
		  await sleep(1);
		  i = 0;
		}
	  }
	} catch (e) {
	  if (connected) console.error(e);
	}
  };
  loop();
};
// ファイル読み込み共通処理（トップレベル - 接続前から有効）
const loadFile = (file) => {
  if (!file) return;
  filename.textContent = file.name;
  const fr = new FileReader();
  fr.onload = (e) => {
	tapaste.value = e.target.result;
  };
  fr.readAsText(file, "UTF-8");
};

// ファイル選択ボタン
fileinput.onchange = () => loadFile(fileinput.files[0]);

// ドラッグ＆ドロップ
pastebar.addEventListener("dragover", (e) => {
  e.preventDefault();
  pastebar.classList.add("dragover");
});
pastebar.addEventListener("dragleave", () => {
  pastebar.classList.remove("dragover");
});
pastebar.addEventListener("drop", (e) => {
  e.preventDefault();
  pastebar.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  loadFile(file);
});

btnreq.onclick = async () => {
  if (disconnect) {
	await disconnect();
	return;
  }
  try {
	const port = await navigator.serial.requestPort();
	await main(port);
	dot.className = "connected";
	connlabel.textContent = "接続中";
	btnreq.textContent = "切断";
  } catch (e) {
	console.error(e);
  }
};

/*
const ports = await navigator.serial.getPorts();
if (ports.length > 0) {
  main(ports[0]);

*/

btnfull.onclick = () => {
  ijs.requestFullscreen();
};
</script>
